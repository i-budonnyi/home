<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Avtologistika | Профіль</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
    }
    .layout {
      display: flex;
      min-height: 100vh;
    }
    .sider {
      width: 250px;
      background-color: #001529;
      color: white;
      padding: 20px 0;
    }
    .sider a {
      display: block;
      color: white;
      text-decoration: none;
      padding: 12px 24px;
    }
    .sider a:hover {
      background-color: #1890ff;
    }
    .content {
      flex: 1;
      padding: 20px;
    }
    .header {
      background-color: #003366;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }
    .card {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    .avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #d9d9d9;
      display: inline-block;
      vertical-align: middle;
    }
    .card-title {
      font-size: 20px;
      font-weight: bold;
      margin-left: 16px;
      display: inline-block;
      vertical-align: middle;
    }
    .card-role {
      color: #555;
      margin-left: 80px;
    }
    .contact-info p {
      margin: 10px 0;
    }
    .button {
      background-color: #1890ff;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
    }
    .button:hover {
      background-color: #40a9ff;
    }
  </style>
</head>
<body>
  <div class="layout">
    <div class="sider">
      <a href="#">Блог</a>
      <a href="#">Подати ідею</a>
      <a href="#">Подати проблему</a>
      <a href="#">Мої ідеї</a>
      <a href="#">Мої проблеми</a>
      <a href="#">Підписка</a>
      <a href="#">Мої подані ідеї</a>
    </div>
    <div class="content">
      <div class="header">Avtologistika</div>

      <div class="card">
        <div class="avatar"></div>
        <div class="card-title">Ім'я Прізвище</div>
        <div class="card-role">Роль: worker</div>
        <div class="contact-info">
          <p>
            ☎ Телефон: +38 (000) 000 0000
          </p>
          <p>
            ✉ Email: email@example.com
          </p>
        </div>
      </div>

      <button class="button">Перейти до моїх поданих ідей</button>
    </div>
  </div>
</body>
</html>
